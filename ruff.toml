# Python lint and format settings (SCRUM-108).
line-length = 120
target-version = "py314"
extend-exclude = [".venv", "frontend", "data"]

[lint]
# E/W pycodestyle, F pyflakes, I import order, B bugbear, S bandit (security),
# C4 comprehensions, SIM simplifications, UP pyupgrade (built-in generics and `X | None`).
select = ["E", "W", "F", "I", "B", "S", "C4", "SIM", "UP"]

[lint.per-file-ignores]
# Tests use assert and fixed values on purpose.
"backend/tests/**" = ["S101", "S105", "S106", "S608"]
# Only the module-level _COLUMNS constant is interpolated; all values are bound parameters.
"backend/app/locations_repo.py" = ["S608"]

[lint.isort]
# `factories` is imported as a top-level module by the tests (pytest puts backend/tests on sys.path).
known-first-party = ["backend", "factories"]
