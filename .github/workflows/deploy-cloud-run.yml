name: Deploy to Cloud Run

# Every merge into develop ships the app: build the linux/amd64 image, push it to Artifact Registry
# and roll the Cloud Run service (SCRUM-189). Authentication is keyless through Workload Identity
# Federation; no service account key is stored in GitHub.
on:
  push:
    branches: [develop]
  workflow_dispatch:

# One deployment at a time; a queued merge waits instead of racing the previous rollout.
concurrency:
  group: deploy-cloud-run
  cancel-in-progress: false

env:
  PROJECT_ID: wind-app-515017
  REGION: us-west1
  SERVICE: wind-map
  IMAGE: us-west1-docker.pkg.dev/wind-app-515017/wind-map/wind-map
  RUNTIME_SERVICE_ACCOUNT: wind-map-runner@wind-app-515017.iam.gserviceaccount.com
  LITESTREAM_BUCKET: wind-map-litestream-wind-app-515017

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute the image tag
        id: version
        run: |
          sha="${GITHUB_SHA::7}"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "tag=$(cat VERSION)-$sha" >> "$GITHUB_OUTPUT"

      - id: auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/78673452242/locations/global/workloadIdentityPools/github/providers/github
          service_account: wind-map-deployer@wind-app-515017.iam.gserviceaccount.com
          token_format: access_token

      - name: Log in to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: us-west1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push the image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            GIT_SHA=${{ steps.version.outputs.sha }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.tag }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "$SERVICE" \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --image="$IMAGE:${{ steps.version.outputs.tag }}" \
            --port=5005 \
            --service-account="$RUNTIME_SERVICE_ACCOUNT" \
            --memory=512Mi \
            --max-instances=1 \
            --min-instances=0 \
            --no-cpu-throttling \
            --allow-unauthenticated \
            --set-env-vars="LITESTREAM_BUCKET=$LITESTREAM_BUCKET" \
            --set-secrets="APP_PASSWORD=APP_PASSWORD:latest" \
            --quiet

      - name: Smoke test the deployment
        run: |
          url="$(gcloud run services describe "$SERVICE" --project="$PROJECT_ID" --region="$REGION" --format='value(status.url)')"
          echo "Service URL: $url"
          for _ in $(seq 1 12); do
            if curl -fsS "$url/api/health" | tee /dev/stderr | grep -q '"status":"ok"'; then
              exit 0
            fi
            sleep 5
          done
          echo "The deployed service did not report a healthy /api/health" >&2
          exit 1
