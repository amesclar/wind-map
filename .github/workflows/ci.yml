# CI: tests, lint, coverage, dependency audits and a Docker image scan (SCRUM-108).
name: CI

on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [develop, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff, pytest, coverage, pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Check formatting (ruff format)
        run: ruff format --check .
      - name: Tests with coverage (threshold in .coveragerc)
        run: pytest --cov
      - name: Audit runtime dependencies
        run: pip-audit -r requirements.txt

  frontend:
    name: Frontend (eslint, tsc, vitest, coverage, npm audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: Tests with coverage (thresholds in vitest.config.ts)
        run: npm run test:coverage
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Audit all dependencies (informational)
        # Dev-only tooling advisories (build and test tools, never shipped) should not block merges.
        continue-on-error: true
        run: npm audit --audit-level=high

  docker:
    name: Docker image (build, smoke test, Trivy scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t wind-map:ci .
      - name: Smoke test
        run: |
          docker run -d --name wind-map-ci -p 5005:5005 wind-map:ci
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:5005/api/health; then echo; exit 0; fi
            sleep 1
          done
          docker logs wind-map-ci
          exit 1
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: wind-map:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
